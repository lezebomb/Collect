# Template for an Ubuntu Nginx installation. Replace ALL example values.
# Include inside the http {} block. DNS and certificates must already exist.
# This gateway forwards the caller's JWT; it carries no service-role key.
limit_req_zone $binary_remote_addr zone=dearshelf_auth:10m rate=20r/m;
log_format dearshelf_safe '$remote_addr $request_method $uri $status $request_time';

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/dearshelf-access.log dearshelf_safe;
    client_max_body_size 6m;

    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_REF.supabase.co;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host YOUR_PROJECT_REF.supabase.co;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /auth/v1/ {
        limit_req zone=dearshelf_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass https://YOUR_PROJECT_REF.supabase.co;
    }
    location ^~ /rest/v1/ { proxy_pass https://YOUR_PROJECT_REF.supabase.co; }
    location ^~ /storage/v1/ {
        client_max_body_size 2m;
        proxy_pass https://YOUR_PROJECT_REF.supabase.co;
    }
    location ^~ /functions/v1/ { proxy_pass https://YOUR_PROJECT_REF.supabase.co; }
    location / { return 404; }
}
